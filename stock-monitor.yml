name: Beyblade Stock Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: beyblade-stock-monitor
  cancel-in-progress: true

jobs:
  check-stock:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Check Beyblade stock
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python monitor.py

      - name: Save stock state
        run: |
          if git diff --quiet state.json 2>/dev/null; then
            echo "No state changes."
            exit 0
          fi

          git config user.name "beyblade-stock-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git commit -m "Update stock state"
          git push
